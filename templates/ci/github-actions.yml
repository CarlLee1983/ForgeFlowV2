name: ForgeFlow verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Add repository-specific toolchain and dependency setup steps here.
      # Keep the review-readiness gate in the Makefile rather than duplicating it.
      - name: Verify
        run: make verify
